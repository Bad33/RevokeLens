
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: revokelens
      POSTGRES_USER: revokelens
      POSTGRES_PASSWORD: demo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

volumes:
  pgdata:
